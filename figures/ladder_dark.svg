<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -8 792 460" width="792" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#7d7b75" stroke-width="1.4"/></marker></defs><rect x="-16" y="-8" width="792" height="460" fill="#0d1117"/><text x="0.0" y="20.0" font-size="16" fill="#f0efec" text-anchor="start" font-weight="600">How much of the rating variance each model removes</text><text x="0.0" y="40.0" font-size="12.5" fill="#c3c2b7" text-anchor="start" font-weight="400">Test set. 0% is predicting the average rating for everyone; higher is better.</text><rect x="0.0" y="54.0" width="16.0" height="11.0" rx="2" fill="#3987e5"/><text x="22.0" y="64.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">RPMIA, our runs</text><rect x="152.0" y="54.0" width="16.0" height="11.0" rx="2" fill="#199e70"/><text x="174.0" y="64.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">No-text baseline</text><rect x="311.2" y="54.0" width="16.0" height="11.0" rx="2" fill="#0d1117" stroke="#d95926" stroke-width="1.6"/><text x="333.2" y="64.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">Reported in the paper</text><line x1="286.0" y1="74.0" x2="286.0" y2="398.0" stroke="#4a4a46" stroke-width="1" stroke-linecap="round"/><text x="286.0" y="414.0" font-size="11.5" fill="#7d7b75" text-anchor="middle" font-weight="400">0%</text><line x1="381.0" y1="74.0" x2="381.0" y2="398.0" stroke="#2c2c2a" stroke-width="1" stroke-linecap="round"/><text x="381.0" y="414.0" font-size="11.5" fill="#7d7b75" text-anchor="middle" font-weight="400">10%</text><line x1="476.0" y1="74.0" x2="476.0" y2="398.0" stroke="#2c2c2a" stroke-width="1" stroke-linecap="round"/><text x="476.0" y="414.0" font-size="11.5" fill="#7d7b75" text-anchor="middle" font-weight="400">20%</text><line x1="571.0" y1="74.0" x2="571.0" y2="398.0" stroke="#2c2c2a" stroke-width="1" stroke-linecap="round"/><text x="571.0" y="414.0" font-size="11.5" fill="#7d7b75" text-anchor="middle" font-weight="400">30%</text><line x1="666.0" y1="74.0" x2="666.0" y2="398.0" stroke="#2c2c2a" stroke-width="1" stroke-linecap="round"/><text x="666.0" y="414.0" font-size="11.5" fill="#7d7b75" text-anchor="middle" font-weight="400">40%</text><text x="0.0" y="94.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="400">Released code, as shipped</text><text x="0.0" y="109.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">30 epochs</text><path d="M286.0 87.0 H362.8 a4 4 0 0 1 4 4 V101.0 a4 4 0 0 1 -4 4 H286.0 Z" fill="#3987e5"/><text x="374.8" y="100.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="600">8.5%</text><text x="424.8" y="100.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">MSE 1.092</text><text x="0.0" y="134.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="400">Released code, two bugs fixed</text><text x="0.0" y="149.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">same 30 epochs</text><path d="M286.0 127.0 H401.9 a4 4 0 0 1 4 4 V141.0 a4 4 0 0 1 -4 4 H286.0 Z" fill="#3987e5"/><text x="413.9" y="140.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="600">12.6%</text><text x="463.9" y="140.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">MSE 1.043</text><text x="0.0" y="174.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="400">Released code, two bugs fixed</text><text x="0.0" y="189.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">84 epochs</text><path d="M286.0 167.0 H426.8 a4 4 0 0 1 4 4 V181.0 a4 4 0 0 1 -4 4 H286.0 Z" fill="#3987e5"/><text x="438.8" y="180.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="600">15.2%</text><text x="488.8" y="180.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">MSE 1.011</text><text x="0.0" y="214.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="400">Paper's equations, re-implemented</text><text x="0.0" y="229.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">mean of 3 seeds</text><path d="M286.0 207.0 H398.6 a4 4 0 0 1 4 4 V221.0 a4 4 0 0 1 -4 4 H286.0 Z" fill="#3987e5"/><line x1="395.2" y1="216.0" x2="406.5" y2="216.0" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round"/><line x1="395.2" y1="211.0" x2="395.2" y2="221.0" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round"/><line x1="406.5" y1="211.0" x2="406.5" y2="221.0" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round"/><text x="414.5" y="220.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="600">12.3%</text><text x="464.5" y="220.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">MSE 1.047</text><text x="0.0" y="254.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="400">Paper's equations + user/item bias</text><text x="0.0" y="269.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">1 seed</text><path d="M286.0 247.0 H413.7 a4 4 0 0 1 4 4 V261.0 a4 4 0 0 1 -4 4 H286.0 Z" fill="#3987e5"/><text x="425.7" y="260.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="600">13.9%</text><text x="475.7" y="260.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">MSE 1.028</text><text x="0.0" y="294.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="400">Paper's equations, own review hidden</text><text x="0.0" y="309.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">in training; mean of 3 seeds</text><path d="M286.0 287.0 H427.4 a4 4 0 0 1 4 4 V301.0 a4 4 0 0 1 -4 4 H286.0 Z" fill="#3987e5"/><line x1="430.5" y1="296.0" x2="432.9" y2="296.0" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round"/><line x1="430.5" y1="291.0" x2="430.5" y2="301.0" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round"/><line x1="432.9" y1="291.0" x2="432.9" y2="301.0" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round"/><text x="440.9" y="300.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="600">15.3%</text><text x="490.9" y="300.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">MSE 1.011</text><text x="0.0" y="334.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="600">User + item biases, no text</text><text x="0.0" y="349.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">the baseline</text><path d="M286.0 327.0 H457.7 a4 4 0 0 1 4 4 V341.0 a4 4 0 0 1 -4 4 H286.0 Z" fill="#199e70"/><text x="469.7" y="340.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="600">18.5%</text><text x="519.7" y="340.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">MSE 0.972</text><text x="0.0" y="374.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="600">RPMIA as reported in the paper</text><text x="0.0" y="389.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">not measured here</text><rect x="286.0" y="367.0" width="355.3" height="18.0" rx="3" fill="#0d1117" stroke="#d95926" stroke-width="1.6" stroke-dasharray="5 3"/><text x="649.3" y="380.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="600">37.4%</text><text x="699.3" y="380.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">MSE 0.747</text><text x="0.0" y="436.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">Whiskers: lowest and highest seed. Each run is scored at its best validation epoch.</text></svg>