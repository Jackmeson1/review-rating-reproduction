<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -8 792 316" width="792" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#7d7b75" stroke-width="1.4"/></marker></defs><rect x="-16" y="-8" width="792" height="316" fill="#0d1117"/><text x="0.0" y="20.0" font-size="16" fill="#f0efec" text-anchor="start" font-weight="600">The shape bug: four predictions become sixteen</text><text x="0.0" y="40.0" font-size="12.5" fill="#c3c2b7" text-anchor="start" font-weight="400">Drawn for a batch of 4. One side has shape [B, 1], the other [B]; subtracting them gives [B, B].</text><text x="19.0" y="84.0" font-size="13" fill="#f0efec" text-anchor="middle" font-weight="600">J₂</text><rect x="6.0" y="96.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="6.0" y="126.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="6.0" y="156.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="6.0" y="186.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><text x="58.0" y="162.0" font-size="20" fill="#c3c2b7" text-anchor="middle" font-weight="400">−</text><text x="142.0" y="128.0" font-size="13" fill="#f0efec" text-anchor="middle" font-weight="600">J₃</text><rect x="84.0" y="141.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="114.0" y="141.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="144.0" y="141.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="174.0" y="141.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><text x="228.0" y="162.0" font-size="20" fill="#c3c2b7" text-anchor="middle" font-weight="400">=</text><rect x="256.0" y="96.0" width="27.0" height="27.0" rx="4" fill="#3987e5" stroke="#4a4a46" stroke-width="1"/><rect x="286.0" y="96.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="316.0" y="96.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="346.0" y="96.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="256.0" y="126.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="286.0" y="126.0" width="27.0" height="27.0" rx="4" fill="#3987e5" stroke="#4a4a46" stroke-width="1"/><rect x="316.0" y="126.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="346.0" y="126.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="256.0" y="156.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="286.0" y="156.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="316.0" y="156.0" width="27.0" height="27.0" rx="4" fill="#3987e5" stroke="#4a4a46" stroke-width="1"/><rect x="346.0" y="156.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="256.0" y="186.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="286.0" y="186.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="316.0" y="186.0" width="27.0" height="27.0" rx="4" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><rect x="346.0" y="186.0" width="27.0" height="27.0" rx="4" fill="#3987e5" stroke="#4a4a46" stroke-width="1"/><rect x="252.0" y="92.0" width="34.0" height="124.0" rx="6" fill="none" stroke="#d95926" stroke-width="2"/><text x="316.0" y="84.0" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">as shipped: [B, B]</text><rect x="398.0" y="102.0" width="14.0" height="14.0" rx="3" fill="#3987e5"/><text x="420.0" y="114.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">the correct values</text><text x="420.0" y="129.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">sit on the diagonal</text><rect x="398.0" y="148.0" width="14.0" height="14.0" rx="3" fill="none" stroke="#d95926" stroke-width="2"/><text x="420.0" y="160.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">evaluation reads</text><text x="420.0" y="175.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">column 0 only</text><text x="398.0" y="204.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">training compares each rating</text><text x="398.0" y="219.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">with its whole row</text><text x="633.0" y="84.0" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">fixed: [B, 1]</text><rect x="620.0" y="96.0" width="27.0" height="27.0" rx="4" fill="#3987e5" stroke="#4a4a46" stroke-width="1"/><rect x="620.0" y="126.0" width="27.0" height="27.0" rx="4" fill="#3987e5" stroke="#4a4a46" stroke-width="1"/><rect x="620.0" y="156.0" width="27.0" height="27.0" rx="4" fill="#3987e5" stroke="#4a4a46" stroke-width="1"/><rect x="620.0" y="186.0" width="27.0" height="27.0" rx="4" fill="#3987e5" stroke="#4a4a46" stroke-width="1"/><text x="0.0" y="262.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">The fix is one index: J_total = J_1 + 0.5 * (J_2 - J_3[:, None]).</text><text x="0.0" y="282.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">A prediction then depends only on its own pair, not on what else is in the batch.</text></svg>