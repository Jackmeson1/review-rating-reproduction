<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -8 792 684" width="792" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#7d7b75" stroke-width="1.4"/></marker></defs><rect x="-16" y="-8" width="792" height="684" fill="#0d1117"/><text x="0.0" y="20.0" font-size="16" fill="#f0efec" text-anchor="start" font-weight="600">RPMIA, module by module</text><text x="0.0" y="40.0" font-size="12.5" fill="#c3c2b7" text-anchor="start" font-weight="400">Redrawn after Figure 1 of the paper. Right column: what the paper says each module is for.</text><rect x="0.0" y="62.0" width="180.0" height="44.0" rx="7" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><text x="90.0" y="80.6" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">User document</text><text x="90.0" y="96.1" font-size="11.0" fill="#c3c2b7" text-anchor="middle" font-weight="400">every review the user wrote</text><rect x="196.0" y="62.0" width="180.0" height="44.0" rx="7" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><text x="286.0" y="80.6" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">Item document</text><text x="286.0" y="96.1" font-size="11.0" fill="#c3c2b7" text-anchor="middle" font-weight="400">every review the item got</text><text x="410.0" y="74.0" font-size="13.5" fill="#f0efec" text-anchor="start" font-weight="600">Inputs</text><text x="410.0" y="90.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">up to 300 words each</text><text x="410.0" y="108.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">The same pipeline runs on both sides.</text><line x1="90.0" y1="106.0" x2="90.0" y2="129.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><line x1="286.0" y1="106.0" x2="286.0" y2="129.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="0.0" y="132.0" width="376.0" height="36.0" rx="7" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><text x="188.0" y="154.4" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">Word embedding</text><text x="410.0" y="142.0" font-size="13.5" fill="#f0efec" text-anchor="start" font-weight="600">Embedding</text><text x="410.0" y="158.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">Eq. 1</text><text x="410.0" y="176.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">Pretrained Word2Vec vectors, 50-d.</text><line x1="90.0" y1="168.0" x2="90.0" y2="191.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><line x1="286.0" y1="168.0" x2="286.0" y2="191.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="-8.0" y="186.0" width="392.0" height="128.0" rx="10" fill="#0d1117" stroke="#3987e5" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="0.0" y="194.0" width="180.0" height="40.0" rx="7" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><text x="90.0" y="210.6" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">Convolutions</text><text x="90.0" y="226.1" font-size="11.0" fill="#c3c2b7" text-anchor="middle" font-weight="400">a local context per word</text><rect x="196.0" y="194.0" width="180.0" height="40.0" rx="7" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><text x="286.0" y="210.6" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">Convolutions</text><text x="286.0" y="226.1" font-size="11.0" fill="#c3c2b7" text-anchor="middle" font-weight="400">a local context per word</text><line x1="90.0" y1="234.0" x2="90.0" y2="257.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><line x1="286.0" y1="234.0" x2="286.0" y2="257.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="0.0" y="260.0" width="376.0" height="46.0" rx="7" fill="#1f3a5c" stroke="#3987e5" stroke-width="1.5"/><text x="188.0" y="279.6" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">Multi-head cross-attention</text><text x="188.0" y="295.1" font-size="11.0" fill="#c3c2b7" text-anchor="middle" font-weight="400">each side's words weighted against the other side</text><text x="410.0" y="204.0" font-size="13.5" fill="#f0efec" text-anchor="start" font-weight="600">Context-aware interaction</text><text x="410.0" y="220.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">Eq. 2–7 · level 1</text><text x="410.0" y="238.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">Stated purpose: decide which words matter</text><text x="410.0" y="254.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">for this user–item pair, from several</text><text x="410.0" y="270.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">views at once.</text><line x1="90.0" y1="306.0" x2="90.0" y2="337.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><line x1="286.0" y1="306.0" x2="286.0" y2="337.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="-8.0" y="332.0" width="392.0" height="122.0" rx="10" fill="#0d1117" stroke="#3987e5" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="0.0" y="340.0" width="180.0" height="40.0" rx="7" fill="#1f3a5c" stroke="#3987e5" stroke-width="1.5"/><text x="90.0" y="356.6" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">Two-layer gate</text><text x="90.0" y="372.1" font-size="11.0" fill="#c3c2b7" text-anchor="middle" font-weight="400">5 learned aspect vectors</text><rect x="196.0" y="340.0" width="180.0" height="40.0" rx="7" fill="#1f3a5c" stroke="#3987e5" stroke-width="1.5"/><text x="286.0" y="356.6" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">Two-layer gate</text><text x="286.0" y="372.1" font-size="11.0" fill="#c3c2b7" text-anchor="middle" font-weight="400">5 learned aspect vectors</text><line x1="90.0" y1="380.0" x2="90.0" y2="403.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><line x1="286.0" y1="380.0" x2="286.0" y2="403.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="0.0" y="406.0" width="180.0" height="40.0" rx="7" fill="#1f3a5c" stroke="#3987e5" stroke-width="1.5"/><text x="90.0" y="422.6" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">Self-attention</text><text x="90.0" y="438.1" font-size="11.0" fill="#c3c2b7" text-anchor="middle" font-weight="400">5 user aspects</text><rect x="196.0" y="406.0" width="180.0" height="40.0" rx="7" fill="#1f3a5c" stroke="#3987e5" stroke-width="1.5"/><text x="286.0" y="422.6" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">Self-attention</text><text x="286.0" y="438.1" font-size="11.0" fill="#c3c2b7" text-anchor="middle" font-weight="400">5 item aspects</text><text x="410.0" y="350.0" font-size="13.5" fill="#f0efec" text-anchor="start" font-weight="600">Aspect-aware interaction</text><text x="410.0" y="366.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">Eq. 8–10 · level 2</text><text x="410.0" y="384.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">Stated purpose: distil the aspects each</text><text x="410.0" y="400.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">side cares about and weight them by</text><text x="410.0" y="416.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">importance.</text><line x1="90.0" y1="446.0" x2="90.0" y2="477.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><line x1="286.0" y1="446.0" x2="286.0" y2="477.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="-8.0" y="472.0" width="392.0" height="62.0" rx="10" fill="#0d1117" stroke="#3987e5" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="0.0" y="480.0" width="180.0" height="46.0" rx="7" fill="#1f3a5c" stroke="#3987e5" stroke-width="1.5"/><text x="90.0" y="499.7" font-size="12" fill="#f0efec" text-anchor="middle" font-weight="600">5 × 5 aspect pairs</text><text x="90.0" y="514.7" font-size="10.5" fill="#c3c2b7" text-anchor="middle" font-weight="400">each user aspect × each item aspect</text><rect x="196.0" y="480.0" width="180.0" height="46.0" rx="7" fill="#1f3a5c" stroke="#3987e5" stroke-width="1.5"/><text x="286.0" y="499.6" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">Joint attention</text><text x="286.0" y="515.1" font-size="11.0" fill="#c3c2b7" text-anchor="middle" font-weight="400">weights the 25 pairs</text><line x1="182.0" y1="503.0" x2="192.0" y2="503.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><text x="410.0" y="488.0" font-size="13.5" fill="#f0efec" text-anchor="start" font-weight="600">Aspect-pair (UIAP) interaction</text><text x="410.0" y="504.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">Eq. 11–13 · level 3</text><text x="410.0" y="522.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">Stated purpose: capture the joint effect of</text><text x="410.0" y="538.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">a preference and the matching item trait.</text><line x1="286.0" y1="526.0" x2="286.0" y2="555.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="0.0" y="558.0" width="84.0" height="40.0" rx="7" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><text x="42.0" y="582.4" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">FM</text><rect x="96.0" y="558.0" width="84.0" height="40.0" rx="7" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><text x="138.0" y="582.4" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">FNN</text><rect x="196.0" y="558.0" width="180.0" height="40.0" rx="7" fill="#161b22" stroke="#4a4a46" stroke-width="1"/><text x="286.0" y="574.6" font-size="12.5" fill="#f0efec" text-anchor="middle" font-weight="600">Sum, then sigmoid</text><text x="286.0" y="590.1" font-size="11.0" fill="#c3c2b7" text-anchor="middle" font-weight="400">predicted rating</text><line x1="182.0" y1="578.0" x2="192.0" y2="578.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><line x1="286.0" y1="558.0" x2="286.0" y2="550.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round"/><line x1="286.0" y1="550.0" x2="42.0" y2="550.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round"/><line x1="42.0" y1="550.0" x2="42.0" y2="555.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><line x1="138.0" y1="550.0" x2="138.0" y2="555.0" stroke="#7d7b75" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><text x="410.0" y="566.0" font-size="13.5" fill="#f0efec" text-anchor="start" font-weight="600">Prediction</text><text x="410.0" y="582.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">Eq. 14–16</text><text x="410.0" y="600.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">Stated purpose: a factorisation machine for</text><text x="410.0" y="616.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">the direct effect of the pairs, a feed-forward</text><text x="410.0" y="632.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">network for deeper associations.</text><text x="0.0" y="640.0" font-size="11" fill="#7d7b75" text-anchor="start" font-weight="400">Dashed frames: the three interaction levels the paper presents as its contribution.</text></svg>