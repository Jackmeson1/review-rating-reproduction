<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -8 792 316" width="792" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8f8d86" stroke-width="1.4"/></marker></defs><rect x="-16" y="-8" width="792" height="316" fill="#ffffff"/><text x="0.0" y="20.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Rebuilding the inputs the repository leaves out</text><text x="0.0" y="40.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">The loader needs every user's and item's review text; the repository ships ratings, ids and a dictionary only.</text><rect x="0.0" y="66.0" width="166.0" height="70.0" rx="7" fill="#f6f5f1" stroke="#c3c2b7" stroke-width="1"/><text x="83.0" y="89.9" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Raw reviews</text><text x="83.0" y="105.4" font-size="11.0" fill="#52514e" text-anchor="middle" font-weight="400">Amazon Grocery,</text><text x="83.0" y="120.9" font-size="11.0" fill="#52514e" text-anchor="middle" font-weight="400">2014 5-core file</text><rect x="198.0" y="66.0" width="166.0" height="70.0" rx="7" fill="#f6f5f1" stroke="#c3c2b7" stroke-width="1"/><text x="281.0" y="89.9" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Recover user ids</text><text x="281.0" y="105.4" font-size="11.0" fill="#52514e" text-anchor="middle" font-weight="400">join on item, rating</text><text x="281.0" y="120.9" font-size="11.0" fill="#52514e" text-anchor="middle" font-weight="400">and timestamp</text><line x1="169.0" y1="101.0" x2="194.0" y2="101.0" stroke="#8f8d86" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="396.0" y="66.0" width="166.0" height="70.0" rx="7" fill="#f6f5f1" stroke="#c3c2b7" stroke-width="1"/><text x="479.0" y="89.9" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Tokenise</text><text x="479.0" y="105.4" font-size="11.0" fill="#52514e" text-anchor="middle" font-weight="400">lowercase, keep</text><text x="479.0" y="120.9" font-size="11.0" fill="#52514e" text-anchor="middle" font-weight="400">dictionary words</text><line x1="367.0" y1="101.0" x2="392.0" y2="101.0" stroke="#8f8d86" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="594.0" y="66.0" width="166.0" height="70.0" rx="7" fill="#f6f5f1" stroke="#c3c2b7" stroke-width="1"/><text x="677.0" y="89.9" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Build documents</text><text x="677.0" y="105.4" font-size="11.0" fill="#52514e" text-anchor="middle" font-weight="400">training-split</text><text x="677.0" y="120.9" font-size="11.0" fill="#52514e" text-anchor="middle" font-weight="400">reviews only</text><line x1="565.0" y1="101.0" x2="590.0" y2="101.0" stroke="#8f8d86" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="0.0" y="168.0" width="242.7" height="84.0" rx="8" fill="#f6f5f1" stroke="#c3c2b7" stroke-width="1"/><text x="14.0" y="204.0" font-size="21" fill="#0b0b0b" text-anchor="start" font-weight="700">151,226 of 151,226</text><text x="14.0" y="228.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">rating rows matched to one reviewer</text><rect x="258.7" y="168.0" width="242.7" height="84.0" rx="8" fill="#f6f5f1" stroke="#c3c2b7" stroke-width="1"/><text x="272.7" y="204.0" font-size="21" fill="#0b0b0b" text-anchor="start" font-weight="700">19,987 of 19,987</text><text x="272.7" y="228.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">dictionary words found in the 70% split</text><rect x="517.3" y="168.0" width="242.7" height="84.0" rx="8" fill="#f6f5f1" stroke="#c3c2b7" stroke-width="1"/><text x="531.3" y="204.0" font-size="21" fill="#0b0b0b" text-anchor="start" font-weight="700">0</text><text x="531.3" y="228.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">validation or test reviews in any document</text><text x="0.0" y="280.0" font-size="11" fill="#8f8d86" text-anchor="start" font-weight="400">Checks on the rebuild. The second one also shows which split the authors built their documents from.</text></svg>